<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
      color:#1A1917;
      background:linear-gradient(180deg,#FBFAF6 0%,#F4F1E8 100%);
      -webkit-font-smoothing:antialiased;}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;}
    .label{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:1.4px; color:#6E6B64; text-transform:uppercase;}
    .card{background:#FFFFFF; border:1px solid #E9E5D9; border-radius:20px;}
    .est{border-bottom:1.5px dotted #9A9488; padding-bottom:2px;}
    .meta{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; color:#6E6B64; display:flex; align-items:center; flex-wrap:wrap; gap:4px;}
    .note{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; color:#8F6420; line-height:1.4;}
    .hair{height:1px; background:#F0ECE0; flex-shrink:0;}
    .field{display:inline-flex; align-items:center; height:36px; min-width:64px; padding:0 12px; box-sizing:border-box; border-radius:10px; background:#F1EDE2; border:1px solid #E9E5D9; font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:17px; font-weight:600; color:#1A1917;}
    .field.on{background:#FFFFFF; border:1.5px solid #1A1917; padding:0 11.5px;}
    .caret{display:inline-block; width:2px; height:21px; background:#8F6420; margin-left:1px; border-radius:1px;}
    .unit{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:13px; color:#6E6B64;}
    .kcal{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:16px; font-weight:600; flex-shrink:0;}
    .name{font-size:16px; color:#1A1917; line-height:1.3;}
    .part{font-size:15px; color:#56534C; line-height:1.3;}
    .btn{height:46px; border-radius:13px; background:#1A1917; color:#FBFAF6; font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
    .hit{width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
    .pin{position:absolute; width:20px; height:20px; border-radius:50%; background:#1A1917; color:#FBFAF6; font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 3px rgba(251,250,246,0.9);}
  </style>
</helmet>

<div style="width:390px; height:844px; box-sizing:border-box; position:relative; overflow:hidden;">

  <!-- the entry behind, pushed back by the sheet -->
  <div style="position:absolute; inset:0; background:#D9D5CB;"></div>
  <div style="position:absolute; top:47px; left:10px; right:10px; height:20px; border-radius:12px 12px 0 0; background:#EDEAE1;"></div>

  <div style="position:absolute; top:56px; left:0; right:0; bottom:0; border-radius:14px 14px 0 0; background:linear-gradient(180deg,#FBFAF6 0%,#F4F1E8 100%); display:flex; flex-direction:column; overflow:hidden;">
    <div style="height:5px; width:36px; border-radius:3px; background:#CFCABE; margin:6px auto 0 auto; flex-shrink:0;"></div>

    <div style="flex-grow:1; overflow:hidden; padding:14px 20px 0 20px; display:flex; flex-direction:column; gap:14px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between;">
        <span style="font-size:28px; font-weight:600; letter-spacing:-0.3px;">Edit amounts</span>
        <span style="font-size:16px; color:#56534C;">Cancel</span>
      </div>
      <div class="card" style="padding:16px 18px; display:flex; flex-direction:column; gap:11px; flex-shrink:0;">
        
        <div style=" display:flex; flex-direction:column; gap:4px; min-height:44px;">
          <div class="name">Chicken stew</div>
          <span class="mono" style="font-size:11px; color:#6E6B64;">1 bowl</span>
        </div>
        
        <div style="padding-left:11px; display:flex; flex-direction:column; gap:4px; min-height:44px;">
          <div class="part">Chicken pieces</div>
          <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-size:20px; font-weight:600; width:92px; display:inline-flex; align-items:center;">150</span><span class="mono" style="font-size:11px; color:#6E6B64;">g</span></div>
        </div>
        
        <div style="padding-left:11px; display:flex; flex-direction:column; gap:4px; min-height:44px;">
          <div class="part">Cooking oil</div>
          <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-size:20px; font-weight:600; width:92px; display:inline-flex; align-items:center;">0.5<span class="caret" style="height:22px;"></span></span><span class="mono" style="font-size:11px; color:#6E6B64;">tbsp</span></div>
        </div>
        
        <div style="padding-left:11px; display:flex; flex-direction:column; gap:4px; min-height:44px;">
          <div class="part">Onion and tomato</div>
          <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-size:20px; font-weight:600; width:92px; display:inline-flex; align-items:center;">100</span><span class="mono" style="font-size:11px; color:#6E6B64;">g</span></div>
        </div>
        
        <div style="padding-left:11px; display:flex; flex-direction:column; gap:4px; min-height:44px;">
          <div class="part">Spices</div>
          <span class="mono" style="font-size:11px; color:#6E6B64;">No amount to change</span>
        </div>
        <div class="hair"></div>
        
        <div style=" display:flex; flex-direction:column; gap:4px; min-height:44px;">
          <div class="name">White rice, boiled</div>
          <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-size:20px; font-weight:600; width:92px; display:inline-flex; align-items:center;">1.5</span><span class="mono" style="font-size:11px; color:#6E6B64;">cup</span></div>
        </div>
        <div class="hair"></div>
        
        <div style=" display:flex; flex-direction:column; gap:4px; min-height:44px;">
          <div class="name">White bread</div>
          <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-size:20px; font-weight:600; width:92px; display:inline-flex; align-items:center;">1</span><span class="mono" style="font-size:11px; color:#6E6B64;">slice</span></div>
        </div>
      </div>
      <div class="mono" style="font-size:11px; color:#56534C; flex-shrink:0;">665 → 708 kcal · +43</div>
      <div class="btn" style="height:52px;">Save</div>
    </div>
    <!-- the system decimal pad renders here; nothing of ours is drawn in this space -->
    <div style="height:258px; flex-shrink:0; border-top:1px solid #E3DFD3; background:#EFEBDF; display:flex; align-items:center; justify-content:center;"><span style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:1.2px; color:#A8A296; text-transform:uppercase;">system keyboard · decimal pad</span></div>
  </div>

  <!-- review pins, not UI -->
  <div class="pin" style="top:268px; left:356px;">1</div>
  <div class="pin" style="top:574px; left:186px;">2</div>
  <div class="pin" style="top:186px; left:356px;">3</div>
  <div class="pin" style="top:116px; left:186px;">4</div>
</div>
</x-dc>
</body>
</html>
