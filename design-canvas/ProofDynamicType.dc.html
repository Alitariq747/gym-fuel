<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
      color:#1A1917;
      background:linear-gradient(180deg,#FBFAF6 0%,#F4F1E8 100%);
      -webkit-font-smoothing:antialiased;}
    a{color:#8F6420;} a:hover{color:#6F4D18;}
  </style>
</helmet>

<div style="width:390px; height:1080px; box-sizing:border-box; display:flex; flex-direction:column;">

  <div style="height:56px; flex-shrink:0;"></div>

  <div style="padding:0 20px 6px 20px;">
    <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; letter-spacing:1.2px; color:#8F6420; text-transform:uppercase;">AX3 · largest accessibility size</div>
  </div>

  <div style="padding:6px 20px 14px 20px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
    <div style="display:flex; flex-direction:column; gap:5px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:38px; font-weight:600; letter-spacing:-0.7px;">Today</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:16px; letter-spacing:1.2px; color:#6E6B64;">WED 9 SEP</div>
    </div>
    <div style="width:48px; height:48px; display:flex; align-items:center; justify-content:flex-end;">
      <svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="#1A1917" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h14M3 10h10M3 14h6"/></svg>
    </div>
  </div>

  <!-- macro bars stack at AX sizes instead of sitting in three columns -->
  <div style="margin:0 16px 6px 16px; background:#FFFFFF; border:1px solid #E9E5D9; border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:14px;">
    <div style="display:flex; flex-direction:column; gap:4px;">
      <div style="display:flex; align-items:baseline; gap:9px;">
        <span style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:36px; font-weight:600; letter-spacing:-0.8px;">1,020</span>
        <span style="font-size:21px; color:#56534C;">left</span>
      </div>
      <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#6E6B64;">1,380 of 2,400</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="height:4px; border-radius:2px; background:#E8E4D8; overflow:hidden;"><div style="width:49%; height:4px; background:#1A1917;"></div></div>
        <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#6E6B64;">81 / 165 P</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="height:4px; border-radius:2px; background:#E8E4D8; overflow:hidden;"><div style="width:56%; height:4px; background:#1A1917;"></div></div>
        <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#6E6B64;">134 / 240 C</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="height:4px; border-radius:2px; background:#E8E4D8; overflow:hidden;"><div style="width:70%; height:4px; background:#1A1917;"></div></div>
        <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#6E6B64;">56 / 80 F</div>
      </div>
    </div>
  </div>

  <!-- rows go vertical: the number drops below the title, the thumbnail drops out -->
  <div style="display:flex; flex-direction:column; gap:4px;">

    <div style="padding:12px 20px; display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:26px; font-weight:500; letter-spacing:-0.3px; line-height:1.3;">paratha and chai</div>
      <div style="display:flex; align-items:baseline; gap:10px;">
        <span style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:24px; font-weight:600; border-bottom:2px dotted #9A9488; padding-bottom:3px;">420</span>
        <span style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#6E6B64;">kcal</span>
      </div>
      <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#6E6B64; line-height:1.5;">08:20 · 9P 48C 21F</div>
      <div style="min-height:44px; display:flex; align-items:center; font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#8F6420; line-height:1.5;">1 assumption ›</div>
    </div>

    <div style="padding:12px 20px; display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:26px; font-weight:500; letter-spacing:-0.3px; line-height:1.3;">two roti, chicken karahi, half a katori rice</div>
      <div style="display:flex; align-items:baseline; gap:10px;">
        <span style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:24px; font-weight:600; border-bottom:2px dotted #9A9488; padding-bottom:3px;">780</span>
        <span style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#6E6B64;">kcal</span>
      </div>
      <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#6E6B64; line-height:1.5;">13:45 · 42P 78C 32F</div>
      <div style="min-height:44px; display:flex; align-items:center; font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:15px; color:#8F6420; line-height:1.5;">3 assumptions ›</div>
    </div>

  </div>

  <div style="flex-grow:1;"></div>

  <!-- the dock keeps its four targets but drops the labels rather than truncating them -->
  <div style="margin:0 20px 10px 20px; background:#FFFFFF; border:1px solid #EAE6DA; border-radius:36px; padding:8px 10px; display:flex; gap:2px; box-shadow:0 1px 3px rgba(26,25,23,0.05), 0 10px 26px rgba(26,25,23,0.07);">
    <div style="flex-grow:1; min-height:56px; display:flex; align-items:center; justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D3B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 3V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div style="flex-grow:1; min-height:56px; display:flex; align-items:center; justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D3B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
    </div>
    <div style="flex-grow:1; min-height:56px; display:flex; align-items:center; justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D3B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M17 21H5a2 2 0 0 1-2-2V7"/></svg>
    </div>
    <div style="flex-grow:1; min-height:56px; display:flex; align-items:center; justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D3B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    </div>
  </div>

  <div style="height:34px; flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
