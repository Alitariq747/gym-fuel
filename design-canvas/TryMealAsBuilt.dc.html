<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
      color:#1A1917;
      background:linear-gradient(180deg,#FBFAF6 0%,#F4F1E8 100%);
      -webkit-font-smoothing:antialiased;}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;}
    .label{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:1.4px; color:#6E6B64; text-transform:uppercase;}
    .card{background:#FFFFFF; border:1px solid #E9E5D9; border-radius:20px; box-sizing:border-box;}
    .est{border-bottom:1.5px dotted #9A9488; padding-bottom:2px;}
    .meta{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; color:#6E6B64; display:flex; align-items:center; flex-wrap:wrap; gap:4px;}
    .note{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; color:#8F6420; line-height:1.4;}
    .hair{height:1px; background:#F0ECE0; flex-shrink:0;}
    .well{border-radius:50%; background:#F1EDE2; border:1px solid #E9E5D9; box-sizing:border-box; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
    .btn{height:52px; border-radius:14px; background:#1A1917; color:#FBFAF6; font-size:17px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; flex-shrink:0;}
    .quiet{min-height:44px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:500; color:#6E6B64;}
    .caret{display:inline-block; width:2px; height:25px; background:#8F6420; border-radius:1px; vertical-align:-5px; margin-left:2px;}
    .pin{position:absolute; width:20px; height:20px; border-radius:50%; background:#1A1917; color:#FBFAF6; font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 3px rgba(251,250,246,0.9);}
  </style>
</helmet>

<div style="width:390px; height:844px; box-sizing:border-box; display:flex; flex-direction:column; position:relative; overflow:hidden; background:linear-gradient(180deg,#FBFAF6 0%,#F4F1E8 100%); color:#1A1917;">
<!-- Try a meal · as built · 11 October -->
  <div style="height:56px; flex-shrink:0;"></div>
  <div style="padding:8px 16px 0 16px; height:44px; flex-shrink:0; display:flex; align-items:center; gap:12px;">
    <div style="width:44px; height:44px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="flex-grow:1; height:4px; border-radius:2px; background:#E8E4D8; overflow:hidden;">
      <div style="width:21.4%; height:4px; border-radius:2px; background:#8F6420;"></div>
    </div>
  </div>

  <div style="padding:18px 20px 0 20px; display:flex; flex-direction:column; gap:20px; flex-grow:1;">
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div class="label">In your own words</div>
      <div style="font-size:28px; font-weight:600; letter-spacing:-0.5px; line-height:1.2;">Tell us a meal you often eat.</div>
      <div style="font-size:15px; color:#56534C; line-height:1.45;">Pick one you couldn't find in an app. Say it the way you'd tell a friend.</div>
    </div>
    <!-- the field: no edge, no caret until tapped -->
    <div style="font-size:22px; font-weight:500; color:#6E6B64; line-height:1.3; min-height:58px;">Your meal</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <div class="label">Or tap one</div>
        <div style="align-self:flex-start; height:44px; padding:0 18px; border-radius:14px; background:#FFFFFF; border:1px solid #E3DFD3; box-sizing:border-box; display:flex; align-items:center; font-size:16px; font-weight:500;">2 eggs, toast and tea</div>
        <div style="align-self:flex-start; height:44px; padding:0 18px; border-radius:14px; background:#FFFFFF; border:1px solid #E3DFD3; box-sizing:border-box; display:flex; align-items:center; font-size:16px; font-weight:500;">rice with chicken stew</div>
        <div style="align-self:flex-start; height:44px; padding:0 18px; border-radius:14px; background:#FFFFFF; border:1px solid #E3DFD3; box-sizing:border-box; display:flex; align-items:center; font-size:16px; font-weight:500;">a bowl of noodles with vegetables</div>
    </div>
  </div>
  <div class="pin" style="top:252px; left:130px;">1</div>
  <div class="pin" style="top:370px; left:222px;">2</div>
  <div style="padding:12px 20px 12px 20px; display:flex; flex-direction:column; gap:4px; flex-shrink:0;">
    <div class="btn" style="opacity:0.45;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FBFAF6" stroke-width="1.7" stroke-linejoin="round"><path d="M10 3.5C10.6 7.7 12.3 9.4 16.5 10C12.3 10.6 10.6 12.3 10 16.5C9.4 12.3 7.7 10.6 3.5 10C7.7 9.4 9.4 7.7 10 3.5Z"/><path d="M18 14.5C18.3 16.4 19.1 17.2 21 17.5C19.1 17.8 18.3 18.6 18 20.5C17.7 18.6 16.9 17.8 15 17.5C16.9 17.2 17.7 16.4 18 14.5Z"/></svg>Estimate this</div>
    <div class="quiet">Show me an example instead</div>
  </div>
  <div style="height:34px; flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
