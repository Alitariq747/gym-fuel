<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
      color:#1A1917;
      background:linear-gradient(180deg,#FBFAF6 0%,#F4F1E8 100%);
      -webkit-font-smoothing:antialiased;}
    a{color:#8F6420;} a:hover{color:#6F4D18;}
  </style>
</helmet>

<div style="width:390px; height:844px; box-sizing:border-box; display:flex; flex-direction:column;">

  <div style="height:56px; flex-shrink:0;"></div>

  <div style="padding:0 20px 14px 20px; display:flex; align-items:flex-start; justify-content:space-between;">
    <div style="display:flex; flex-direction:column; gap:3px;">
      <div style="display:flex; align-items:center; gap:6px;">
        <span style="font-size:27px; font-weight:600; letter-spacing:-0.5px;">Today</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; letter-spacing:1.5px; color:#6E6B64;">WED 9 SEP</div>
    </div>
    <div style="width:44px; height:44px; display:flex; align-items:center; justify-content:flex-end;">
      <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="#1A1917" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h14M3 10h10M3 14h6"/></svg>
    </div>
  </div>

  <!-- the total counts only what is settled; the rest is named, not guessed at -->
  <div style="margin:0 16px 6px 16px; background:#FFFFFF; border:1px solid #E9E5D9; border-radius:20px; padding:15px 18px; display:flex; flex-direction:column; gap:12px;">
    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <div style="display:flex; align-items:baseline; gap:7px;">
        <span style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:27px; font-weight:600; letter-spacing:-0.6px;">1,980</span>
        <span style="font-size:15px; color:#56534C;">left</span>
      </div>
      <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11.5px; color:#8F6420;">2 still estimating</div>
    </div>
    <div style="display:flex; gap:14px;">
      <div style="flex-grow:1; display:flex; flex-direction:column; gap:5px;">
        <div style="height:3px; border-radius:2px; background:#E8E4D8; overflow:hidden;"><div style="width:5%; height:3px; background:#1A1917;"></div></div>
        <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:10.5px; color:#6E6B64;">9 / 165 P</div>
      </div>
      <div style="flex-grow:1; display:flex; flex-direction:column; gap:5px;">
        <div style="height:3px; border-radius:2px; background:#E8E4D8; overflow:hidden;"><div style="width:20%; height:3px; background:#1A1917;"></div></div>
        <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:10.5px; color:#6E6B64;">48 / 240 C</div>
      </div>
      <div style="flex-grow:1; display:flex; flex-direction:column; gap:5px;">
        <div style="height:3px; border-radius:2px; background:#E8E4D8; overflow:hidden;"><div style="width:26%; height:3px; background:#1A1917;"></div></div>
        <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:10.5px; color:#6E6B64;">21 / 80 F</div>
      </div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column;">

    <!-- settled -->
    <div style="padding:9px 20px 2px 20px; display:flex; align-items:flex-start; gap:13px;">
      <div style="width:44px; height:44px; border-radius:11px; background:#F1EDE2; border:1px solid #E9E5D9; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8A296" stroke-width="1.7" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h8"/></svg>
      </div>
      <div style="display:flex; flex-direction:column; gap:3px; flex-grow:1;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px;">
          <div style="font-size:18px; font-weight:500; letter-spacing:-0.2px; line-height:1.25;">paratha and chai</div>
          <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:16.5px; font-weight:600; border-bottom:1.5px dotted #9A9488; padding-bottom:2px; flex-shrink:0;">420</div>
        </div>
        <div style="min-height:40px; display:flex; flex-direction:column; justify-content:center; gap:3px;">
          <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; color:#6E6B64;">08:20 · 9P 48C 21F</div>
          <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; color:#8F6420;">1 assumption · 1 tbsp ghee</div>
        </div>
      </div>
    </div>

    <!-- IMAGE analysing: the scanner sweep survives from the current build -->
    <div style="padding:9px 20px 2px 20px; display:flex; align-items:flex-start; gap:13px;">
      <div style="width:44px; height:44px; border-radius:11px; background:#EAE6DA; flex-shrink:0; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C0BAA8" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M7.5 13.5a4.5 4.5 0 0 1 9 0"/></svg>
        <div style="position:absolute; top:0; bottom:0; left:8px; width:15px; background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0) 100%);"></div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px; flex-grow:1; padding-top:1px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:14px;">
          <div style="font-size:18px; font-weight:500; letter-spacing:-0.2px; color:#56534C;">your photo</div>
          <div style="width:38px; border-bottom:1.5px dotted #9A9488; flex-shrink:0;"></div>
        </div>
        <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; color:#8F6420;">estimating calories and macros</div>
        <div style="height:3px; border-radius:2px; background:#E8E4D8; overflow:hidden; margin-top:2px;"><div style="width:42%; height:3px; border-radius:2px; background:#8F6420; margin-left:22%;"></div></div>
      </div>
    </div>

    <!-- TEXT analysing: the raw sentence is already the title, so nothing shifts on success -->
    <div style="padding:11px 20px 2px 20px; display:flex; align-items:flex-start; gap:13px;">
      <div style="width:44px; height:44px; border-radius:11px; background:#F1EDE2; border:1px solid #E9E5D9; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8A296" stroke-width="1.7" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h8"/></svg>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px; flex-grow:1; padding-top:1px;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px;">
          <div style="font-size:18px; font-weight:500; letter-spacing:-0.2px; line-height:1.25; color:#56534C;">two roti, chicken karahi, half a katori rice</div>
          <div style="width:38px; border-bottom:1.5px dotted #9A9488; flex-shrink:0; margin-top:11px;"></div>
        </div>
        <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace; font-size:11px; color:#8F6420;">estimating</div>
        <div style="height:3px; border-radius:2px; background:#E8E4D8; overflow:hidden; margin-top:2px;"><div style="width:34%; height:3px; border-radius:2px; background:#8F6420; margin-left:8%;"></div></div>
      </div>
    </div>

  </div>

  <div style="flex-grow:1;"></div>

  <div style="margin:0 20px 10px 20px; background:#FFFFFF; border:1px solid #EAE6DA; border-radius:34px; padding:9px 12px; display:flex; gap:2px; box-shadow:0 1px 3px rgba(26,25,23,0.05), 0 10px 26px rgba(26,25,23,0.07);">
    <div style="flex-grow:1; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3D3B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 3V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>
      <span style="font-size:10px; font-weight:600; color:#56534C;">Text</span>
    </div>
    <div style="flex-grow:1; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3D3B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
      <span style="font-size:10px; font-weight:600; color:#56534C;">Camera</span>
    </div>
    <div style="flex-grow:1; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3D3B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M17 21H5a2 2 0 0 1-2-2V7"/></svg>
      <span style="font-size:10px; font-weight:600; color:#56534C;">Gallery</span>
    </div>
    <div style="flex-grow:1; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3D3B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <span style="font-size:10px; font-weight:600; color:#56534C;">Saved</span>
    </div>
  </div>

  <div style="height:34px; flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
